# 流水线名称
name: Node.js CI/CD Pipeline

# 流水线触发器
on:
    push:
        branches: ['main']

    # 允许手动在线触发流水线
    workflow_dispatch:

# 环境变量
env:
    REGISTRY: docker.io
    IMAGE_NAME: ${{ github.repository }} # 格式为：owner/repo

jobs:
    # CI 流水线
    build-and-test:
        name: CI - Build and Test
        runs-on: ubuntu-latest

        steps:
            # 拉取代码
            - name: Checkout code
              uses: actions/checkout@v4
            
            # 配置 Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                # 设置缓存依赖
                cache: 'npm'

            # 安装依赖
            - name: Install dependencies
              run: npm ci

            # 运行测试
            - name: Run tests
              run: npm test

            # （可选）构建步骤
            # - name: Build
            #   run: npm run build

    # CD 流水线
    docker-build-push:
        name: CD - Docker Build and Push Image
        runs-on: ubuntu-latest
        needs: [build-and-test] # needs, 表示该作业依赖于 build-and-test 作业的成功完成
        # 只有 main 分支的推送才会触发
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 校验 Docker Hub secrets 是否已配置，避免出现不明错误
            - name: Validate Docker Hub secrets
              run: |
                if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
                  echo "ERROR: DOCKER_USERNAME or DOCKER_PASSWORD is not set. Add them under Repository settings → Secrets and variables → Actions."
                  exit 1
                fi

            # 登录 Docker Hub
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                registry: docker.io
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            # 提取 docker 元数据（自动生成标签，比如：latest 和 git-sha）
            - name: Extract metadata (tags) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
                tags: |
                  type=raw,value=latest
                  type=sha,prefix=,format=short

            # 构建并推送 Docker 镜像，利用 GitHub 的 BuildKit 加速
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                # cache-from: type=gha
                # cache-to: type=gha,mode=max

            # 模拟部署步骤（可选）, 打印出镜像标签
            - name: Output image tags
              run: |
                echo "Docker image build successful."
                echo ${{ steps.meta.outputs.tags }}

            # （拓展）真正部署到 k8s （先注释掉）
            # - name: Deploy to Kubernetes
            #   run: |
            #     kubectl set image deployment/my-deployment my-container=${{ steps.meta.outputs.tags }}
            # env:
            #     KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}